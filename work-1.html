<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container{
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .login{
            width: 500px;
            height: 430px;
            border: 3px solid black;
            border-radius: 10px;
            position: relative;
            left: 450px;
            top: 100px;
            padding: 20px;

            animation: loginOpen 0.8s ease-out;

            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }

        
        .login:hover{
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            transform: translateY(-5px);
        }

        
        @keyframes loginOpen {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(30px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .login-img{
            position: relative;
            left: 45px;

            
            transition: transform 0.4s ease;
        }

        
        .login-img:hover{
            transform: rotate(-10deg) scale(1.15);
        }

        .login-h1{
            font-size: 40px;
            position: relative;
            left: 45px;

            transition: color 0.3s ease, transform 0.3s ease;
        }

       
        .login-h1:hover{
            color: #1DA1F2;
            transform: translateX(5px);
        }

        .form input{
            width: 400px;
            height: 40px;
            font-size: 16px;
            border-radius: 10px;
            border: 2px solid black;
            position: relative;
            left: 45px;
            padding: 5px;

          
            transition: all 0.3s ease;
        }

        
        .form input:hover{
            border-color: #1DA1F2;
            box-shadow: 0 0 8px rgba(29, 161, 242, 0.25);
        }

        
        .form input:focus{
            outline: none;
            border-color: #1DA1F2;
            box-shadow: 0 0 0 4px rgba(29, 161, 242, 0.15);
            transform: scale(1.02);
        }

        .form button{
            width: 415px;
            height: 43px;
            border-radius: 30px;
            font-size: 18px;
            border: none;
            background-color: #1DA1F2;
            position: relative;
            left: 45px;

            
            color: white;
            cursor: pointer;

            
            transition: all 0.3s ease;
        }

        
        .form button:hover{
            background-color: #0d8bd9;
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(29, 161, 242, 0.35);
        }

      
        .form button:active{
            transform: translateY(1px) scale(0.97);
            box-shadow: 0 3px 8px rgba(29, 161, 242, 0.25);
        }

        .wrapper{
            display: flex;
            gap: 130px;
            position: relative;
            left: 54px;
            top: 10px;
        }

        .wrapper p{
            color: #1DA1F2;
            font-size: 18px;

           
            cursor: pointer;
            transition: all 0.3s ease;
        }

      
        .wrapper p:hover{
            color: #0d8bd9;
            transform: translateY(-2px);
            text-decoration: underline;
        }

       
        .wrapper p:active{
            transform: scale(0.95);
        }


      
        .form input.error{
            border-color: red;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.25);

            animation: shake 0.4s ease;
        }

        
        @keyframes shake{
            0%{
                transform: translateX(0);
            }

            25%{
                transform: translateX(-8px);
            }

            50%{
                transform: translateX(8px);
            }

            75%{
                transform: translateX(-5px);
            }

            100%{
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="login">

            <img 
                class="login-img" 
                src="./images/twitter-logo-4 1.svg" 
                alt="bird"
            >

            <h1 class="login-h1">
                Log in to Twitter
            </h1>

            <form class="form" onsubmit="goToSignup(event)">

                <input 
                    type="text" 
                    placeholder="Phone number, email address"
                >

                <br><br>

                <input 
                    type="text" 
                    placeholder="Password"
                >

                <br><br>

                <button>
                    Log In
                </button>

            </form>

            <div class="wrapper">

                <p>
                    Forgot password?
                </p>

                <p>
                    Sign up to Twitter?
                </p>

            </div>

        </div>

    </div>


    <script>

        function goToSignup(event) {

           
            event.preventDefault();


          
            const inputs = document.querySelectorAll(".form input");


            
            const username = inputs[0].value.trim();
            const password = inputs[1].value.trim();


          
            inputs[0].classList.remove("error");
            inputs[1].classList.remove("error");


            if (username === "") {
                inputs[0].classList.add("error");
            }


         
            if (password === "") {
                inputs[1].classList.add("error");
            }


       
            if (username === "" || password === "") {
                return;
            }


            
            const loginData = {
                username: username,
                password: password
            };


          
            let loginHistory = JSON.parse(
                localStorage.getItem("loginHistory")
            ) || [];


            
            loginHistory.push(loginData);


            
            localStorage.setItem(
                "loginHistory",
                JSON.stringify(loginHistory)
            );


            
            window.location.href = "work-2.html";
        }

    </script>

</body>
</html>
